name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x FoilTrackerPhone/gradlew
          chmod +x FoilTrackerWatch/gradlew

      - name: Build Phone APK
        working-directory: FoilTrackerPhone
        run: ./gradlew assembleDebug

      - name: Build Watch APK
        working-directory: FoilTrackerWatch
        run: ./gradlew assembleDebug

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: FoilTrackerPhone/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Watch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: FoilTrackerWatch/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: ./apks/phone

      - name: Download Watch APK
        uses: actions/download-artifact@v4
        with:
          name: watch-apk
          path: ./apks/watch

      - name: Rename APKs
        run: |
          mv ./apks/phone/app-debug.apk ./apks/FoilTrackerPhone-debug.apk
          mv ./apks/watch/app-debug.apk ./apks/FoilTrackerWatch-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./apks/FoilTrackerPhone-debug.apk
            ./apks/FoilTrackerWatch-debug.apk
          generate_release_notes: true
