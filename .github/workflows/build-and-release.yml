name: Build and Release AABs + APKs

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Validate FoilTracker GPX expectations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x FoilTrackerWatch/gradlew
          chmod +x FoilTrackerWatch/validate_expectations.sh
          chmod +x FoilTrackerWatch/foiltrack_vs_rb.sh
          chmod +x FoilTrackerWatch/foiltrack_from_gpx.sh
          chmod +x FoilTrackerWatch/speed_from_gpx.rb
          chmod +x FoilTrackerWatch/anonimize_foiltrack.rb

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install GPX validation dependencies
        run: gem install nokogiri

      - name: Validate FoilTracker expectations
        working-directory: FoilTrackerWatch
        shell: bash
        run: ./validate_expectations.sh

  build:
    name: Build ${{ matrix.name }} ${{ matrix.type }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Phone
            project: FoilTrackerPhone
            type: AAB
            task: bundleRelease
            output: app/build/outputs/bundle/release/app-release.aab
            artifact: FoilTrackerPhone-aab

          - name: Phone
            project: FoilTrackerPhone
            type: APK
            task: assembleRelease
            output: app/build/outputs/apk/release/app-release.apk
            artifact: FoilTrackerPhone-apk

          - name: Watch
            project: FoilTrackerWatch
            type: AAB
            task: bundleRelease
            output: app/build/outputs/bundle/release/app-release.aab
            artifact: FoilTrackerWatch-aab

          - name: Watch
            project: FoilTrackerWatch
            type: APK
            task: assembleRelease
            output: app/build/outputs/apk/release/app-release.apk
            artifact: FoilTrackerWatch-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ${{ matrix.project }}/gradlew

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          BASE=$((1000000 + MAJOR * 1000000 + MINOR * 1000 + PATCH))

          PHONE_VERSION_CODE=$((BASE * 2))
          WATCH_VERSION_CODE=$((BASE * 2 + 1))

          if [[ "${{ matrix.name }}" == "Phone" ]]; then
            VERSION_CODE="$PHONE_VERSION_CODE"
          else
            VERSION_CODE="$WATCH_VERSION_CODE"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Version code: $VERSION_CODE"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > ${{ matrix.project }}/app/upload-keystore.jks

      - name: Build ${{ matrix.type }}
        working-directory: ${{ matrix.project }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew ${{ matrix.task }} \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Upload ${{ matrix.type }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/${{ matrix.output }}

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f ${{ matrix.project }}/app/upload-keystore.jks

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Phone AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: ./release/phone-aab

      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-apk
          path: ./release/phone-apk

      - name: Download Watch AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: ./release/watch-aab

      - name: Download Watch APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-apk
          path: ./release/watch-apk

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename release files
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mv ./release/phone-aab/app-release.aab \
             "./release/FoilTrackerPhone-${VERSION}.aab"

          mv ./release/phone-apk/app-release.apk \
             "./release/FoilTrackerPhone-${VERSION}.apk"

          mv ./release/watch-aab/app-release.aab \
             "./release/FoilTrackerWatch-${VERSION}.aab"

          mv ./release/watch-apk/app-release.apk \
             "./release/FoilTrackerWatch-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/FoilTrackerPhone-${{ steps.version.outputs.version }}.aab
            ./release/FoilTrackerPhone-${{ steps.version.outputs.version }}.apk
            ./release/FoilTrackerWatch-${{ steps.version.outputs.version }}.aab
            ./release/FoilTrackerWatch-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
