name: Build and Release AABs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed AABs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x FoilTrackerPhone/gradlew
          chmod +x FoilTrackerWatch/gradlew

      # ----------------------------------------
      # Signing
      # ----------------------------------------

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > FoilTrackerPhone/app/upload-keystore.jks
          echo "$KEYSTORE_BASE64" | base64 --decode > FoilTrackerWatch/app/upload-keystore.jks

      # ----------------------------------------
      # Phone
      # ----------------------------------------

      - name: Build Phone AAB
        working-directory: FoilTrackerPhone
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ----------------------------------------
      # Watch
      # ----------------------------------------

      - name: Build Watch AAB
        working-directory: FoilTrackerWatch
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ----------------------------------------
      # Upload build artifacts
      # ----------------------------------------

      - name: Upload Phone AAB
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: FoilTrackerPhone/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Watch AAB
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: FoilTrackerWatch/app/build/outputs/bundle/release/app-release.aab

      # ----------------------------------------
      # Clean signing files
      # ----------------------------------------

      - name: Remove signing keystores
        if: always()
        run: |
          rm -f FoilTrackerPhone/app/upload-keystore.jks
          rm -f FoilTrackerWatch/app/upload-keystore.jks

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Phone AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: ./aab/phone

      - name: Download Watch AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: ./aab/watch

      - name: Rename AABs
        run: |
          mv ./aab/phone/app-release.aab ./aab/FoilTrackerPhone-release.aab
          mv ./aab/watch/app-release.aab ./aab/FoilTrackerWatch-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./aab/FoilTrackerPhone-release.aab
            ./aab/FoilTrackerWatch-release.aab
          generate_release_notes: true
