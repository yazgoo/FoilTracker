name: Build and Release APKs

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v', e.g., v1.0.0

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x FoilTrackerWatch/gradlew
          chmod +x FoilTrackerPhone/gradlew

      - name: Build Phone APK (Debug/Release)
        run: |
          cd FoilTrackerPhone
          # Change to assembleRelease if you have signing keys set up
          ./gradlew assembleDebug

      - name: Build Watch APK (Debug/Release)
        run: |
          cd FoilTrackerWatch
          # Change to assembleRelease if you have signing keys set up
          ./gradlew assembleDebug

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: FoilTrackerPhone/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Watch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: FoilTrackerWatch/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: ./apks

      - name: Download Watch APK
        uses: actions/download-artifact@v4
        with:
          name: watch-apk
          path: ./apks

      - name: Rename APKs for clarity
        run: |
          mv ./apks/app-debug.apk ./apks/FoilTrackerPhone-debug.apk
          # If the watch module output has the same filename, rename it to prevent overwriting
          # Adjust path if your watch module outputs to a different folder structure
          find ./apks -name "app-debug.apk" -exec mv {} ./apks/FoilTrackerWatch-debug.apk \;

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./apks/*.apk
          generate_release_notes: true
