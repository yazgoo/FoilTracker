name: Build and Release AABs + APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed AABs + APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x FoilTrackerPhone/gradlew
          chmod +x FoilTrackerWatch/gradlew

      # ----------------------------------------
      # Signing
      # ----------------------------------------

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > FoilTrackerPhone/app/upload-keystore.jks
          echo "$KEYSTORE_BASE64" | base64 --decode > FoilTrackerWatch/app/upload-keystore.jks

      # ----------------------------------------
      # Phone
      # ----------------------------------------

      - name: Build Phone Release AAB
        working-directory: FoilTrackerPhone
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build Phone Release APK
        working-directory: FoilTrackerPhone
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ----------------------------------------
      # Watch
      # ----------------------------------------

      - name: Build Watch Release AAB
        working-directory: FoilTrackerWatch
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build Watch Release APK
        working-directory: FoilTrackerWatch
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ----------------------------------------
      # Upload build artifacts
      # ----------------------------------------

      - name: Upload Phone AAB
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: FoilTrackerPhone/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerPhone-apk
          path: FoilTrackerPhone/app/build/outputs/apk/release/app-release.apk

      - name: Upload Watch AAB
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: FoilTrackerWatch/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: FoilTrackerWatch-apk
          path: FoilTrackerWatch/app/build/outputs/apk/release/app-release.apk

      # ----------------------------------------
      # Clean signing files
      # ----------------------------------------

      - name: Remove signing keystores
        if: always()
        run: |
          rm -f FoilTrackerPhone/app/upload-keystore.jks
          rm -f FoilTrackerWatch/app/upload-keystore.jks

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Download artifacts
      # ----------------------------------------

      - name: Download Phone AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: ./release/phone-aab

      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-apk
          path: ./release/phone-apk

      - name: Download Watch AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: ./release/watch-aab

      - name: Download Watch APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-apk
          path: ./release/watch-apk

      # ----------------------------------------
      # Rename files
      # ----------------------------------------

      - name: Rename release files
        run: |
          mv ./release/phone-aab/app-release.aab \
             ./release/FoilTrackerPhone-release.aab

          mv ./release/phone-apk/app-release.apk \
             ./release/FoilTrackerPhone-release.apk

          mv ./release/watch-aab/app-release.aab \
             ./release/FoilTrackerWatch-release.aab

          mv ./release/watch-apk/app-release.apk \
             ./release/FoilTrackerWatch-release.apk

      # ----------------------------------------
      # Create GitHub Release
      # ----------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/FoilTrackerPhone-release.aab
            ./release/FoilTrackerPhone-release.apk
            ./release/FoilTrackerWatch-release.aab
            ./release/FoilTrackerWatch-release.apk
          generate_release_notes: true
