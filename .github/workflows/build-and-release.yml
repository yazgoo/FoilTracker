name: Build and Release AABs + APKs

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ========================================
  # GPX validation
  # Runs on every push
  # ========================================

  test:
    name: Validate FoilTracker GPX expectations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x FoilTrackerWatch/gradlew
          chmod +x FoilTrackerWatch/validate_expectations.sh
          chmod +x FoilTrackerWatch/foiltrack_vs_rb.sh
          chmod +x FoilTrackerWatch/foiltrack_from_gpx.sh
          chmod +x FoilTrackerWatch/speed_from_gpx.rb
          chmod +x FoilTrackerWatch/anonimize_foiltrack.rb

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install GPX validation dependencies
        run: gem install nokogiri

      - name: Validate FoilTracker expectations
        working-directory: FoilTrackerWatch
        shell: bash
        run: ./validate_expectations.sh


  # ========================================
  # Build
  # Only runs for v* tags
  # ========================================

  build:
    name: Build ${{ matrix.name }} ${{ matrix.type }}

    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # ------------------------------
          # PHONE
          # ------------------------------

          - name: Phone
            project: FoilTrackerPhone
            type: AAB
            task: bundleRelease
            output: app/build/outputs/bundle/release/app-release.aab
            artifact: FoilTrackerPhone-aab

          - name: Phone
            project: FoilTrackerPhone
            type: APK
            task: assembleRelease
            output: app/build/outputs/apk/release/app-release.apk
            artifact: FoilTrackerPhone-apk

          # ------------------------------
          # WATCH
          # ------------------------------

          - name: Watch
            project: FoilTrackerWatch
            type: AAB
            task: bundleRelease
            output: app/build/outputs/bundle/release/app-release.aab
            artifact: FoilTrackerWatch-aab

          - name: Watch
            project: FoilTrackerWatch
            type: APK
            task: assembleRelease
            output: app/build/outputs/apk/release/app-release.apk
            artifact: FoilTrackerWatch-apk

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # Java
      # ========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ========================================
      # Calculate version
      # ========================================

      - name: Calculate version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Remove leading "v"
          VERSION="${TAG#v}"

          # Require strict semver: X.Y.Z
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # Encode semantic version into a monotonically increasing number.
          #
          # Example:
          #   0.0.11 -> 11
          #   0.0.12 -> 12
          #   0.1.0  -> 1000
          #   1.0.0  -> 1000000
          #
          # Add 1,000,000 so we are safely above old manual version codes.
          BASE=$((1000000 + MAJOR * 1000000 + MINOR * 1000 + PATCH))

          # Separate version-code ranges for phone and watch.
          #
          # Phone: BASE * 2
          # Watch: BASE * 2 + 1
          #
          # Therefore every Play upload gets a unique code.
          PHONE_VERSION_CODE=$((BASE * 2))
          WATCH_VERSION_CODE=$((BASE * 2 + 1))

          echo "VERSION_NAME=$VERSION"
          echo "PHONE_VERSION_CODE=$PHONE_VERSION_CODE"
          echo "WATCH_VERSION_CODE=$WATCH_VERSION_CODE"

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "phone_version_code=$PHONE_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "watch_version_code=$WATCH_VERSION_CODE" >> "$GITHUB_OUTPUT"

      # ========================================
      # Signing
      # ========================================

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > ${{ matrix.project }}/app/upload-keystore.jks

      # ========================================
      # Select version code
      # ========================================

      - name: Select version code
        id: app_version
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "Phone" ]; then
            VERSION_CODE="${{ steps.version.outputs.phone_version_code }}"
          else
            VERSION_CODE="${{ steps.version.outputs.watch_version_code }}"
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # ========================================
      # Build
      # ========================================

      - name: Build ${{ matrix.type }}
        working-directory: ${{ matrix.project }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew ${{ matrix.task }} \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.app_version.outputs.version_code }}"

      # ========================================
      # Upload artifact
      # ========================================

      - name: Upload ${{ matrix.type }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/${{ matrix.output }}

      # ========================================
      # Remove signing key
      # ========================================

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f ${{ matrix.project }}/app/upload-keystore.jks


  # ========================================
  # GitHub Release
  # ========================================

  release:
    name: Create GitHub Release

    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Download Phone AAB
      # ========================================

      - name: Download Phone AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-aab
          path: ./release/phone-aab

      # ========================================
      # Download Phone APK
      # ========================================

      - name: Download Phone APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerPhone-apk
          path: ./release/phone-apk

      # ========================================
      # Download Watch AAB
      # ========================================

      - name: Download Watch AAB
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-aab
          path: ./release/watch-aab

      # ========================================
      # Download Watch APK
      # ========================================

      - name: Download Watch APK
        uses: actions/download-artifact@v4
        with:
          name: FoilTrackerWatch-apk
          path: ./release/watch-apk

      # ========================================
      # Rename
      # ========================================

      - name: Rename release files
        run: |
          mv ./release/phone-aab/app-release.aab \
             ./release/FoilTrackerPhone-release.aab

          mv ./release/phone-apk/app-release.apk \
             ./release/FoilTrackerPhone-release.apk

          mv ./release/watch-aab/app-release.aab \
             ./release/FoilTrackerWatch-release.aab

          mv ./release/watch-apk/app-release.apk \
             ./release/FoilTrackerWatch-release.apk

      # ========================================
      # Create GitHub Release
      # ========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/FoilTrackerPhone-release.aab
            ./release/FoilTrackerPhone-release.apk
            ./release/FoilTrackerWatch-release.aab
            ./release/FoilTrackerWatch-release.apk

          generate_release_notes: true
